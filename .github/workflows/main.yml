name: Build & Publish Release APK

on:
  workflow_dispatch: # 👈 This enables the manual "Run workflow" button
  push:
    tags:
      - '*'

jobs:
  Gradle:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4 # Updated to v4 for compatibility
    - name: setup jdk
      uses: actions/setup-java@v4 # Updated to v4 for compatibility
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Make Gradle executable
      run: chmod +x ./gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease
    - name: Releasing using Hub
      uses: sangatdesai/release-apk@main
      env:
       GITHUB_TOKEN: ${{ secrets.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 }} # 👈 Security Fix: Use GitHub's built-in secret
       APP_FOLDER: app
       
